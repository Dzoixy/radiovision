<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZBinary</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0b;
            --panel-bg: #111113;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-sub: #ffffff;
            --btn-white: #ffffff; 
            --gold: #c68e3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
        }

        .sub-logo {
            color: var(--text-sub);
            font-size: 11px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links span {
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* MAIN */
        .main-wrapper {
            display: flex;
            flex: 1;
            padding: 20px 50px;
            gap: 30px;
        }

        .panels-section {
            display: flex;
            flex: 1;
            gap: 25px;
        }

        .panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 4px 25px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
        }

        .sidebar {
            width: 280px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .action-btn {
            background: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            margin: 10px 0;
            cursor: pointer;
        }

        .select-box {
            background: #1a1a1c;
            color: white;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid #333;
        }

        .result-bar {
            margin: 20px 50px;
        }

        #result-text {
            color: #a2fa5f;
        }

        /* LOADING */
        .scanner {
            width: 120px;
            height: 120px;
            border: 2px solid #262626;
            position: relative;
            overflow: hidden;
        }

        .scanner::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, transparent, rgba(198,142,61,0.6), transparent);
            animation: scan 1.5s infinite;
        }

        @keyframes scan {
            0% { top: -40%; }
            100% { top: 100%; }
        }

        .section {
            background: #111113;
            border: 1px solid #262626;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .section h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 8px;
        }

        #result-text {
            color: #a2fa5f;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        #severity-text {
            font-size: 13px;
            color: #ccc;
        }

        #reportBox {
        font-size: 15px;
        color: #a2fa5f;
        line-height: 1.5;
        text-align: center;
        }

        .sidebar {
        width: 200px;
        display: flex;
        flex-direction: column;
        }
    </style>
</head>

<body>

<header>
    <div>
        <div class="logo-text">GenZBinary</div>
        <div class="sub-logo">ระบบช่วยวิเคราะห์ X-ray ด้วย Machine Learning</div>
    </div>

    <div class="nav-links">
        <span onclick="openModal('how')">หลักการทำงาน</span>
        <span onclick="openModal('guide')">คู่มือการใช้งาน</span>
        <span onclick="openModal('about')">ผู้จัดทำ</span>
    </div>
</header>

<div class="main-wrapper">

    <!-- PANELS -->
    <div class="panels-section">

        <!-- INPUT -->
        <div class="panel" id="dropZone">
            <input type="file" id="fileInput" hidden>

            <div class="panel-label">INPUT</div>

            <div id="dropText" style="color:#888;text-align:center;">
                <p>Drop Image Here</p>
                <p style="font-size:12px;">PNG, JPG, DICOM</p>
            </div>
        </div>

        <!-- OUTPUT -->
        <div class="panel">
            <div class="panel-label">OUTPUT</div>

            <div id="outputContainer" style="text-align:center;">

                <img id="resultImage"
                     style="max-width:100%; max-height:100%; display:none;" />

                <div id="outputText" style="color:#888;">
                    WAITING FOR ANALYSIS...
                </div>

            </div>
        </div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">

    <!-- CONTROL -->
    <div class="section">
        <select class="select-box">
            <option>Standard Mode</option>
            <option>Deep Scan</option>
        </select>

        <select class="select-box">
            <option>Diagnostic</option>
            <option>Educational</option>
        </select>

        <button class="action-btn" onclick="analyze()">
            เริ่มวิเคราะห์ภาพ
        </button>
    </div>

    <!-- RESULT -->
    <div class="section">
        <h3>RESULT</h3>
        <div id="result-text"></div>
        <div id="severity-text"></div>
    </div>

    <!-- REPORT -->
    <div class="section">
        <h3>REPORT</h3>
        <div id="reportBox"></div>
    </div>

</aside>

<!-- LOADING -->
<div id="loadingOverlay" style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
">
    <div class="scanner"></div>
    <p style="margin-top:20px;color:#c68e3d;">AI scanning...</p>
</div>

<script src="script.js"></script>

<div id="infoModal" style="
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
">
    <div style="
        background:#111113;
        padding:30px;
        border-radius:12px;
        width:400px;
        max-height:80%;
        overflow:auto;
        text-align:center;
    ">
        <h2 id="modalTitle"></h2>
        <p id="modalContent" style="margin-top:15px; color:#aaa;"></p>

        <button onclick="closeModal()" style="
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:8px;
            background:white;
            cursor:pointer;
        ">ปิด</button>
    </div>
</div>
</body>
</html>
