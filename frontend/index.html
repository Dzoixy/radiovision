<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiovision AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0a0a0b;
            --panel-bg: #111113;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-sub: #888888;
            --btn-white: #ffffff; 
            --gold: #c68e3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
        }

        .sub-logo {
            color: var(--text-sub);
            font-size: 11px;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links span {
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* MAIN */
        .main-wrapper {
            display: flex;
            flex: 1;
            padding: 20px 50px;
            gap: 30px;
        }

        .panels-section {
            display: flex;
            flex: 1;
            gap: 25px;
        }

        .panel {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel-label {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 4px 25px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
        }

        .sidebar {
            width: 280px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            background: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .select-box {
            background: #1a1a1c;
            color: white;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .result-bar {
            margin: 20px 50px;
        }

        #result-text {
            color: #a2fa5f;
        }

        /* LOADING */
        .scanner {
            width: 120px;
            height: 120px;
            border: 2px solid #262626;
            position: relative;
            overflow: hidden;
        }

        .scanner::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, transparent, rgba(198,142,61,0.6), transparent);
            animation: scan 1.5s infinite;
        }

        @keyframes scan {
            0% { top: -40%; }
            100% { top: 100%; }
        }
    </style>
</head>

<body>

<header>
    <div>
        <div class="logo-text">Radiovision AI</div>
        <div class="sub-logo">ADVANCED X-RAY ANALYSIS SYSTEM</div>
    </div>

    <div class="nav-links">
        <span>หลักการทำงาน</span>
        <span>คู่มือการใช้งาน</span>
        <span>ผู้จัดทำ</span>
    </div>
</header>

<div class="main-wrapper">

    <!-- PANELS -->
    <div class="panels-section">

        <!-- INPUT -->
        <div class="panel" id="dropZone">
            <input type="file" id="fileInput" hidden>

            <div class="panel-label">INPUT</div>

            <div id="dropText" style="color:#888;text-align:center;">
                <p>Drop Image Here</p>
                <p style="font-size:12px;">PNG, JPG, DICOM</p>
            </div>
        </div>

        <!-- OUTPUT -->
        <div class="panel">
            <div class="panel-label">OUTPUT</div>

            <div id="outputContainer" style="text-align:center;">

                <img id="resultImage"
                     style="max-width:100%; max-height:100%; display:none;" />

                <div id="outputText" style="color:#888;">
                    WAITING FOR ANALYSIS...
                </div>

            </div>
        </div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="button-group">

            <select class="select-box">
                <option>Standard Mode</option>
                <option>Deep Scan</option>
            </select>

            <select class="select-box">
                <option>Diagnostic</option>
                <option>Educational</option>
            </select>

            <button class="action-btn" onclick="analyze()">
                เริ่มวิเคราะห์ภาพ
            </button>

        </div>
    </aside>

</div>

<!-- RESULT -->
<div class="result-bar">
    <div id="result-text"></div>
</div>

<!-- LOADING -->
<div id="loadingOverlay" style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
">
    <div class="scanner"></div>
    <p style="margin-top:20px;color:#c68e3d;">AI scanning...</p>
</div>

<script src="script.js"></script>

</body>
</html>
